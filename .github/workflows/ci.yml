name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck and unit tests run on Linux (fast, no display needed).
  typecheck-and-test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # The Swift virtual-display helper requires macOS + Xcode toolchain.
  # build:renderer and build:electron are verified here as a bonus since
  # npm ci on macos is already paid for by the helper step.
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build Swift helper
        run: npm run build:helper
